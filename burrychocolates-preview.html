<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burry Chocolates — Hampstead, NC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1008;
      --chocolate: #3d1f0a;
      --cream: #faf5ec;
      --gold: #d4945a;
      --pink: #e8a0b0;
      --card: #251408;
      --card-border: #3d2810;
      --text-muted: #b89a7a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Raleway', sans-serif;
      font-weight: 400;
      line-height: 1.7;
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(26, 16, 8, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(212, 148, 90, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 68px;
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--gold);
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    .nav-logo span {
      color: var(--pink);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--cream);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--gold); }

    .nav-phone {
      font-size: 0.85rem;
      color: var(--gold);
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    /* ── MARQUEE ── */
    .marquee-wrap {
      background: var(--gold);
      overflow: hidden;
      white-space: nowrap;
      padding: 8px 0;
    }

    .marquee-track {
      display: inline-block;
      animation: marquee 28s linear infinite;
    }

    .marquee-track span {
      font-family: 'Raleway', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--bg);
      padding: 0 2rem;
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* ── HERO ── */
    .hero {
      margin-top: 68px;
      position: relative;
      height: 92vh;
      min-height: 560px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 180px;
      background: linear-gradient(to bottom, #1a1008 0%, rgba(26,16,8,0) 100%);
      z-index: 2;
      pointer-events: none;
    }

    .hero-img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      filter: brightness(0.45);
    }

    .hero-content {
      position: relative;
      text-align: center;
      padding: 2rem;
      max-width: 700px;
    }

    .hero-eyebrow {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.2rem;
    }

    .hero-headline {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      font-weight: 700;
      line-height: 1.15;
      color: var(--cream);
      margin-bottom: 1.5rem;
    }

    .hero-headline em {
      font-style: italic;
      color: var(--gold);
    }

    .hero-sub {
      font-size: 1rem;
      color: rgba(250, 245, 236, 0.8);
      font-weight: 400;
      margin-bottom: 2.2rem;
      letter-spacing: 0.04em;
    }

    .hero-cta {
      display: inline-block;
      background: var(--gold);
      color: var(--bg);
      text-decoration: none;
      padding: 0.85rem 2.2rem;
      font-family: 'Raleway', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: background 0.2s, transform 0.2s;
    }

    .hero-cta:hover {
      background: var(--pink);
      transform: translateY(-2px);
    }

    /* ── SECTIONS ── */
    .section {
      padding: 5rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-full {
      padding: 5rem 2rem;
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1.5rem;
    }

    .section-title em {
      font-style: italic;
      color: var(--gold);
    }

    .divider {
      width: 60px;
      height: 3px;
      background: var(--gold);
      margin: 1.5rem 0;
    }

    /* ── CATEGORY GRID ── */
    .categories-section {
      padding: 5rem 2rem;
      background: var(--chocolate);
    }

    .categories-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-top: 3rem;
    }

    .category-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: var(--cream);
      display: block;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
    }

    .category-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      border-color: var(--gold);
    }

    .category-card-img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      transition: transform 0.35s;
    }

    .category-card:hover .category-card-img {
      transform: scale(1.04);
    }

    .category-card-img-wrap {
      overflow: hidden;
    }

    .category-card-body {
      padding: 1.1rem 1.2rem 1.3rem;
    }

    .category-card-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: var(--cream);
    }

    .category-card-meta {
      font-size: 0.78rem;
      color: var(--gold);
      font-weight: 500;
      letter-spacing: 0.06em;
    }

    /* ── HISTORY ── */
    .history-section {
      padding: 6rem 2rem;
      background: var(--bg);
    }

    .history-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5rem;
      align-items: center;
    }

    .history-text p {
      font-size: 1rem;
      color: rgba(250, 245, 236, 0.85);
      margin-bottom: 1.3rem;
      line-height: 1.85;
    }

    .history-img {
      width: 100%;
      border-radius: 4px;
      display: block;
      border: 2px solid var(--card-border);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    /* ── ABOUT ── */
    .about-section {
      padding: 6rem 2rem;
      background: var(--chocolate);
    }

    .about-inner {
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }

    .about-inner .section-title { text-align: center; }
    .about-inner .divider { margin: 1.5rem auto; }

    .about-inner p {
      font-size: 1rem;
      color: rgba(250, 245, 236, 0.85);
      margin-bottom: 1.3rem;
      line-height: 1.85;
    }

    /* ── LOCATION ── */
    .location-section {
      padding: 5rem 2rem;
      background: var(--bg);
    }

    .location-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: start;
    }

    .location-map {
      width: 100%;
      height: 380px;
      border-radius: 4px;
      border: 2px solid var(--card-border);
      display: block;
    }

    .contact-grid {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    .contact-item {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }

    .contact-icon {
      font-size: 1.2rem;
      min-width: 28px;
      color: var(--gold);
    }

    .contact-detail {
      font-size: 0.95rem;
      color: rgba(250, 245, 236, 0.85);
      line-height: 1.6;
    }

    .contact-detail strong {
      display: block;
      color: var(--cream);
      font-weight: 600;
      margin-bottom: 0.2rem;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .contact-detail a {
      color: var(--gold);
      text-decoration: none;
      transition: color 0.2s;
    }

    .contact-detail a:hover { color: var(--pink); }

    .hours-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.3rem 1.5rem;
      font-size: 0.92rem;
    }

    .hours-day { color: rgba(250,245,236,0.7); }
    .hours-time { color: var(--gold); font-weight: 600; }

    /* ── SOCIAL LINKS ── */
    .social-links {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--cream);
      text-decoration: none;
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 2px;
      transition: border-color 0.2s, color 0.2s;
    }

    .social-link:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* ── FOOTER ── */
    footer {
      background: #0e0905;
      border-top: 1px solid rgba(212, 148, 90, 0.15);
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .footer-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }

    .footer-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
    }

    .footer-links a:hover { color: var(--gold); }

    /* ── AOM PREVIEW NOTICE ── */
    .preview-notice {
      background: #0a0a0a;
      border-top: 1px solid rgba(201,151,61,0.25);
      padding: 5rem 1.5rem;
      color: #d4d0c8;
      font-family: 'Cormorant Garamond', Georgia, serif;
      position: relative;
      overflow: hidden;
    }
    .preview-notice__inner {
      max-width: 640px;
      margin: 0 auto;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .preview-notice__ornament {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.25rem;
      margin: 1.5rem 0;
      color: #c9973d;
      font-size: 0.75rem;
      opacity: 0.7;
    }
    .preview-notice__ornament .big {
      font-size: 1rem;
      opacity: 1;
    }
    .preview-notice__heading {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 400;
      color: #e8e3d8;
      letter-spacing: 0.05em;
      line-height: 1.4;
      margin-bottom: 2rem;
    }
    .preview-notice__heading em {
      font-style: italic;
      color: #c9973d;
    }
    .preview-notice__body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1.05rem;
      line-height: 1.8;
      color: #b0aca0;
      max-width: 540px;
      margin: 0 auto 1.5rem;
    }
    .preview-notice__body strong {
      font-style: normal;
      color: #d4af5b;
      font-weight: 500;
    }
    .preview-notice__entity {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      color: #c9973d;
      margin: 1.75rem 0;
      text-transform: uppercase;
    }
    .preview-notice__copyright {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: #6e6a5e;
      text-transform: uppercase;
      margin-top: 1.5rem;
    }
    @media(max-width:640px){
      .preview-notice { padding: 3.5rem 1.25rem; }
      .preview-notice__heading { font-size: 1.4rem; }
      .preview-notice__body { font-size: 0.98rem; }
    }

    /* ── CATEGORY PAGE ── */
    .cat-page {
      margin-top: 68px;
      min-height: calc(100vh - 68px);
    }

    .cat-header {
      position: relative;
      height: 320px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }

    .cat-header-img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.35);
    }

    .cat-header-content {
      position: relative;
      padding: 2.5rem 3rem;
      width: 100%;
    }

    .breadcrumb {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: none;
      margin-bottom: 1rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .breadcrumb:hover { color: var(--pink); }

    .cat-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      color: var(--cream);
      line-height: 1.15;
    }

    .cat-body {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3.5rem 2rem 5rem;
    }

    .cat-description {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--gold);
      padding: 1.2rem 1.5rem;
      border-radius: 2px;
      font-size: 0.95rem;
      color: rgba(250, 245, 236, 0.85);
      margin-bottom: 3rem;
      line-height: 1.75;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.2rem;
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 1.3rem 1.2rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: border-color 0.2s, transform 0.2s;
    }

    .product-card:hover {
      border-color: rgba(212, 148, 90, 0.4);
      transform: translateY(-2px);
    }

    .product-name {
      font-family: 'Playfair Display', serif;
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--cream);
      line-height: 1.35;
    }

    .product-price {
      font-size: 1rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.02em;
    }

    .product-badge {
      display: inline-block;
      background: rgba(180, 160, 140, 0.2);
      border: 1px solid rgba(180, 160, 140, 0.35);
      color: rgba(250, 245, 236, 0.55);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 2px;
      align-self: flex-start;
    }

    .product-limited {
      display: inline-block;
      background: rgba(232, 160, 176, 0.15);
      border: 1px solid rgba(232, 160, 176, 0.3);
      color: var(--pink);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 2px;
      align-self: flex-start;
    }

    .cat-note {
      margin-top: 3rem;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 1.2rem 1.5rem;
      font-size: 0.88rem;
      color: rgba(250, 245, 236, 0.65);
      line-height: 1.7;
      text-align: center;
    }

    .cat-note a {
      color: var(--gold);
      text-decoration: none;
    }

    .instore-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 4rem 2rem;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      text-align: center;
    }

    .instore-icon {
      font-size: 3rem;
    }

    .instore-card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--cream);
    }

    .instore-card p {
      font-size: 0.95rem;
      color: rgba(250,245,236,0.7);
      max-width: 400px;
    }

    .instore-card a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
    }

    /* ── PRICE BY WEIGHT ── */
    .price-by-weight {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }

    .weight-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 1.5rem 1.2rem;
      text-align: center;
      transition: border-color 0.2s;
    }

    .weight-card:hover { border-color: var(--gold); }

    .weight-size {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--cream);
      margin-bottom: 0.4rem;
    }

    .weight-price {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold);
    }

    .weight-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .history-inner { grid-template-columns: 1fr; gap: 2.5rem; }
      .location-inner { grid-template-columns: 1fr; gap: 2rem; }
      .cat-header-content { padding: 1.5rem; }
    }

    /* ── REVIEWS ── */
    .reviews-section { padding: 5rem 1.5rem; background: #251408; text-align: center; }
    .reviews-inner { max-width: 1000px; margin: 0 auto; }
    .reviews-tag { font-family: 'Raleway', sans-serif; font-size: 0.65rem; letter-spacing: 0.4em; text-transform: uppercase; color: #d4945a; margin-bottom: 0.75rem; }
    .reviews-title { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(1.6rem, 3vw, 2.2rem); color: #faf5ec; margin-bottom: 0.5rem; }
    .reviews-title em { color: #d4945a; font-style: italic; }
    .reviews-sub { font-family: 'Raleway', sans-serif; font-size: 0.85rem; color: #a89070; margin-bottom: 3rem; }
    .reviews-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-bottom: 2.5rem; }
    @media(max-width:768px){ .reviews-grid { grid-template-columns: 1fr; } }
    @media(min-width:769px) and (max-width:1024px){ .reviews-grid { grid-template-columns: repeat(2,1fr); } }
    .review-card { background: #1a1008; border: 1px solid rgba(212,148,90,0.2); border-radius: 8px; padding: 1.5rem; text-align: left; }
    .review-stars { color: #d4945a; font-size: 1rem; margin-bottom: 0.75rem; letter-spacing: 0.1em; }
    .review-text { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 0.95rem; line-height: 1.7; color: #f5f0e8; margin-bottom: 1rem; flex: 1; }
    .review-footer { display: flex; justify-content: space-between; align-items: center; }
    .review-author { font-family: 'Raleway', sans-serif; font-size: 0.75rem; font-weight: 600; color: #d4945a; letter-spacing: 0.05em; }
    .review-date { font-family: 'Raleway', sans-serif; font-size: 0.7rem; color: #806050; }

      </div>
    `;
  } else if (isFudge && products) {
    productContent = `
      <div class="product-grid">
        ${products.map(p => `
          <div class="product-card">
            <div class="product-name">${p.name}</div>
            <div class="product-price">${p.price}</div>
          </div>
        `).join('')}
      </div>
    `;
  } else if (products) {
    productContent = `
      <div class="product-grid">
        ${products.map(p => `
          <div class="product-card">
            <div class="product-name">${p.name}</div>
            <div class="product-price">${p.price}</div>
            ${p.limited ? '<span class="product-limited">Limited Item</span>' : ''}
          </div>
        `).join('')}
      </div>
    `;
  }

  return `
    <div class="cat-page">
      <div class="cat-header">
        <img class="cat-header-img" src="${cat.img}" alt="${cat.name}">
        <div class="cat-header-content">
          <a href="#/" class="breadcrumb">← Back to All Categories</a>
          <h1 class="cat-title">${cat.name}</h1>
        </div>
      </div>

      <div class="cat-body">
        ${description ? `<div class="cat-description">${description}</div>` : ''}
        ${productContent}
        <div class="cat-note">
          Online ordering is not available — all products are available in store.<br>
          Call <a href="tel:9108211555">(910) 821-1555</a> to place an order or ask about availability.
          · 21572 US-17, Hampstead, NC · Mon–Sat 9am–7pm
        </div>
      </div>
    </div>
  `;
}

// ─────────────────────────────────────────────
// ROUTER
// ─────────────────────────────────────────────
function getRoute() {
  const hash = window.location.hash;
  if (!hash || hash === '#' || hash === '#/') return '/';
  return hash.replace('#', '');
}

function render() {
  const route = getRoute();
  const app = document.getElementById('app');
  window.scrollTo(0, 0);

  if (route === '/') {
    app.innerHTML = renderHomepage();
  } else {
    const catId = route.replace(/^\//, '');
    app.innerHTML = renderCategoryPage(catId);
  }

  // Fade-in observer
  const fadeEls = document.querySelectorAll('.fade-in');
  if ('IntersectionObserver' in window) {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          obs.unobserve(e.target);
        }
      });
    }, { threshold: 0.1 });
    fadeEls.forEach(el => obs.observe(el));
  } else {
    fadeEls.forEach(el => el.classList.add('visible'));
  }
}

// Handle hash changes
window.addEventListener('hashchange', render);
window.addEventListener('load', render);

// Also run immediately
render();
</script>
