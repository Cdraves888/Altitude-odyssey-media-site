<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULO - Financial Calculator Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0f1e; color: #f9fafb; }
        .container { display: flex; min-height: 100vh; flex-direction: column; }
        .main-content { display: flex; flex: 1; }
        .sidebar { width: 260px; background: #111827; border-right: 1px solid #1f2937; overflow-y: auto; padding: 20px 0; }
        .content { flex: 1; padding: 30px; overflow-y: auto; }
        nav { background: #111827; border-bottom: 1px solid #1f2937; padding: 15px 30px; display: flex; align-items: center; gap: 30px; }
        .logo { font-size: 24px; font-weight: 700; color: #3b82f6; letter-spacing: 2px; }
        .search-bar { flex: 1; max-width: 400px; padding: 10px 15px; background: #0a0f1e; border: 1px solid #1f2937; border-radius: 6px; color: #f9fafb; }
        .go-pro { padding: 10px 20px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .go-pro:hover { background: #2563eb; }
        .category-link { padding: 12px 20px; cursor: pointer; display: block; color: #d1d5db; text-decoration: none; border-left: 3px solid transparent; }
        .category-link:hover, .category-link.active { background: #1f2937; border-left-color: #3b82f6; color: #f9fafb; }
        .calc-header { margin-bottom: 30px; }
        .calc-title { font-size: 32px; font-weight: 700; margin-bottom: 10px; }
        .calc-form { background: #111827; padding: 30px; border-radius: 10px; border: 1px solid #1f2937; max-width: 600px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; }
        .form-input { width: 100%; padding: 12px; background: #0a0f1e; border: 1px solid #1f2937; border-radius: 6px; color: #f9fafb; }
        .form-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .button-group { display: flex; gap: 10px; }
        .btn { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .btn-primary { background: #3b82f6; color: #fff; flex: 1; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: #1f2937; color: #d1d5db; flex: 1; }
        .btn-secondary:hover { background: #374151; }
        .results { margin-top: 30px; background: #111827; padding: 30px; border-radius: 10px; border: 1px solid #1f2937; display: none; }
        .results.show { display: block; }
        .result-item { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #1f2937; }
        .result-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .result-label { font-size: 14px; color: #9ca3af; margin-bottom: 5px; }
        .result-value { font-size: 28px; font-weight: 700; color: #10b981; }
        footer { background: #111827; border-top: 1px solid #1f2937; padding: 30px; text-align: center; font-size: 12px; color: #6b7280; }
        .calc-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
        .calc-btn { padding: 10px 16px; background: #1f2937; border: 1px solid #374151; border-radius: 6px; color: #d1d5db; cursor: pointer; font-size: 13px; }
        .calc-btn:hover { background: #374151; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <div class="logo">CALCULO</div>
            <input type="text" class="search-bar" id="searchInput" placeholder="Search calculators...">
            <button class="go-pro">Go Pro $7.99/mo</button>
        </nav>
        <div class="main-content">
            <div class="sidebar" id="sidebar"></div>
            <div class="content" id="mainContent"></div>
        </div>
        <footer>
            © 2026 Altitude Odyssey Media LLC · All Rights Reserved · Wilmington, NC · studio@altitudeodysseymedia.com<br>
            Calculators are for informational purposes only. Not financial advice.
        </footer>
    </div>
    <script>
        const calculators = [
            {cat:'Loans',name:'Auto Loan',fields:[{n:'Amount',t:'number'},{n:'Rate %',t:'number'},{n:'Term (months)',t:'number'}],calc:(i)=>({payment:((i.Amount*(i['Rate %']/100/12)*(1+i['Rate %']/100/12)**(i['Term (months)'])))/((1+i['Rate %']/100/12)**i['Term (months)']-1)})},
            {cat:'Loans',name:'Car Affordability',fields:[{n:'Income',t:'number'},{n:'Down Payment',t:'number'},{n:'Rate %',t:'number'}],calc:(i)=>({maxPrice:i.Income*0.1/0.005,monthlyPayment:(i.Income*0.1)})},
            {cat:'Loans',name:'Motorcycle Loan',fields:[{n:'Amount',t:'number'},{n:'Rate %',t:'number'},{n:'Term (months)',t:'number'}],calc:(i)=>({payment:((i.Amount*(i['Rate %']/100/12)*(1+i['Rate %']/100/12)**(i['Term (months)'])))/((1+i['Rate %']/100/12)**i['Term (months)']-1)})},
            {cat:'Loans',name:'RV Loan',fields:[{n:'Amount',t:'number'},{n:'Rate %',t:'number'},{n:'Term (months)',t:'number'}],calc:(i)=>({payment:((i.Amount*(i['Rate %']/100/12)*(1+i['Rate %']/100/12)**(i['Term (months)'])))/((1+i['Rate %']/100/12)**i['Term (months)']-1)})},
            {cat:'Loans',name:'Boat Loan',fields:[{n:'Amount',t:'number'},{n:'Rate %',t:'number'},{n:'Term (months)',t:'number'}],calc:(i)=>({payment:((i.Amount*(i['Rate %']/100/12)*(1+i['Rate %']/100/12)**(i['Term (months)'])))/((1+i['Rate %']/100/12)**i['Term (months)']-1)})},
            {cat:'Loans',name:'Personal Loan',fields:[{n:'Amount',t:'number'},{n:'Rate %',t:'number'},{n:'Term (months)',t:'number'}],calc:(i)=>({payment:((i.Amount*(i['Rate %']/100/12)*(1+i['Rate %']/100/12)**(i['Term (months)'])))/((1+i['Rate %']/100/12)**i['Term (months)']-1)})},
            {cat:'Loans',name:'Business Loan',fields:[{n:'Amount',t:'number'},{n:'Rate %',t:'number'},{n:'Term (years)',t:'number'}],calc:(i)=>({payment:((i.Amount*(i['Rate %']/100/12)*(1+i['Rate %']/100/12)**(i['Term (years)']*12)))/((1+i['Rate %']/100/12)**(i['Term (years)']*12)-1)})},
            {cat:'Loans',name:'SBA Loan',fields:[{n:'Amount',t:'number'},{n:'Rate %',t:'number'},{n:'Term (years)',t:'number'}],calc:(i)=>({payment:((i.Amount*(i['Rate %']/100/12)*(1+i['Rate %']/100/12)**(i['Term (years)']*12)))/((1+i['Rate %']/100/12)**(i['Term (years)']*12)-1)})},
            {cat:'Loans',name:'Student Loan',fields:[{n:'Amount',t:'number'},{n:'Rate %',t:'number'},{n:'Term (years)',t:'number'}],calc:(i)=>({payment:((i.Amount*(i['Rate %']/100/12)*(1+i['Rate %']/100/12)**(i['Term (years)']*12)))/((1+i['Rate %']/100/12)**(i['Term (years)']*12)-1)})},
            {cat:'Loans',name:'Student Refinance',fields:[{n:'Amount',t:'number'},{n:'Rate %',t:'number'},{n:'Term (years)',t:'number'}],calc:(i)=>({payment:((i.Amount*(i['Rate %']/100/12)*(1+i['Rate %']/100/12)**(i['Term (years)']*12)))/((1+i['Rate %']/100/12)**(i['Term (years)']*12)-1)})},
            {cat:'Loans',name:'Debt Consolidation',fields:[{n:'Total Debt',t:'number'},{n:'Rate %',t:'number'},{n:'Term (years)',t:'number'}],calc:(i)=>({payment:((i['Total Debt']*(i['Rate %']/100/12)*(1+i['Rate %']/100/12)**(i['Term (years)']*12)))/((1+i['Rate %']/100/12)**(i['Term (years)']*12)-1)})},
            {cat:'Loans',name:'Home Equity Loan',fields:[{n:'Home Value',t:'number'},{n:'Mortgage Balance',t:'number'},{n:'Rate %',t:'number'},{n:'Term (years)',t:'number'}],calc:(i)=>{const eq=i['Home Value']-i['Mortgage Balance'];return{equity:eq,payment:((eq*(i['Rate %']/100/12)*(1+i['Rate %']/100/12)**(i['Term (years)']*12)))/((1+i['Rate %']/100/12)**(i['Term (years)']*12)-1)}}},
            {cat:'Loans',name:'HELOC',fields:[{n:'Home Value',t:'number'},{n:'Mortgage Balance',t:'number'},{n:'Rate %',t:'number'}],calc:(i)=>{const eq=i['Home Value']-i['Mortgage Balance'];return{availableCredit:eq*0.8,monthlyInterest:(eq*0.8)*i['Rate %']/100/12}}},
            {cat:'Loans',name:'Construction Loan',fields:[{n:'Amount',t:'number'},{n:'Rate %',t:'number'},{n:'Term (years)',t:'number'}],calc:(i)=>({payment:((i.Amount*(i['Rate %']/100/12)*(1+i['Rate %']/100/12)**(i['Term (years)']*12)))/((1+i['Rate %']/100/12)**(i['Term (years)']*12)-1)})},
            {cat:'Loans',name:'Equipment Loan',fields:[{n:'Amount',t:'number'},{n:'Rate %',t:'number'},{n:'Term (years)',t:'number'}],calc:(i)=>({payment:((i.Amount*(i['Rate %']/100/12)*(1+i['Rate %']/100/12)**(i['Term (years)']*12)))/((1+i['Rate %']/100/12)**(i['Term (years)']*12)-1)})},
            {cat:'Loans',name:'Commercial Loan',fields:[{n:'Amount',t:'number'},{n:'Rate %',t:'number'},{n:'Term (years)',t:'number'}],calc:(i)=>({payment:((i.Amount*(i['Rate %']/100/12)*(1+i['Rate %']/100/12)**(i['Term (years)']*12)))/((1+i['Rate %']/100/12)**(i['Term (years)']*12)-1)})},
            {cat:'Loans',name:'Loan Payment',fields:[{n:'Amount',t:'number'},{n:'Rate %',t:'number'},{n:'Term (months)',t:'number'}],calc:(i)=>({payment:((i.Amount*(i['Rate %']/100/12)*(1+i['Rate %']/100/12)**(i['Term (months)'])))/((1+i['Rate %']/100/12)**i['Term (months)']-1)})},
            {cat:'Loans',name:'Affordability',fields:[{n:'Income',t:'number'},{n:'Down Payment',t:'number'},{n:'Rate %',t:'number'}],calc:(i)=>({maxLoan:i.Income*0.28/0.005})},
            {cat:'Loans',name:'Interest Only',fields:[{n:'Principal',t:'number'},{n:'Rate %',t:'number'},{n:'Months',t:'number'}],calc:(i)=>({monthlyInterest:i.Principal*(i['Rate %']/100/12),totalInterest:i.Principal*(i['Rate %']/100/12)*i.Months})},
            {cat:'Loans',name:'Payoff Time',fields:[{n:'Balance',t:'number'},{n:'Payment',t:'number'},{n:'Rate %',t:'number'}],calc:(i)=>{const m=i['Rate %']/100/12;const n=-Math.log(1-i.Balance*m/i.Payment)/Math.log(1+m);return{months:Math.ceil(n),years:(Math.ceil(n)/12).toFixed(1)}}},
            {cat:'Loans',name:'Extra Payment Impact',fields:[{n:'Balance',t:'number'},{n:'Rate %',t:'number'},{n:'Monthly Payment',t:'number'},{n:'Extra Payment',t:'number'}],calc:(i)=>{const m=i['Rate %']/100/12;const n=-Math.log(1-i.Balance*m/(i['Monthly Payment']+i['Extra Payment']))/Math.log(1+m);return{monthsSaved:360-Math.ceil(n)}}},
            {cat:'Loans',name:'Debt Snowball',fields:[{n:'Debt 1',t:'number'},{n:'Debt 2',t:'number'},{n:'Debt 3',t:'number'},{n:'Payment/Month',t:'number'}],calc:(i)=>({total:i['Debt 1']+i['Debt 2']+i['Debt 3'],months:(i['Debt 1']+i['Debt 2']+i['Debt 3'])/i['Payment/Month']})},
            {cat:'Loans',name:'Debt Avalanche',fields:[{n:'Debt 1',t:'number'},{n:'Debt 2',t:'number'},{n:'Rate 1 %',t:'number'},{n:'Rate 2 %',t:'number'},{n:'Payment',t:'number'}],calc:(i)=>({highestRate:Math.max(i['Rate 1 %'],i['Rate 2 %'])})},
            {cat:'Loans',name:'Balloon Payment',fields:[{n:'Principal',t:'number'},{n:'Rate %',t:'number'},{n:'Term (months)',t:'number'},{n:'Balloon',t:'number'}],calc:(i)=>({payment:((i.Principal*(i['Rate %']/100/12)*(1+i['Rate %']/100/12)**(i['Term (months)'])))/((1+i['Rate %']/100/12)**i['Term (months)']-1)})},
            {cat:'Loans',name:'Secured Loan',fields:[{n:'Collateral Value',t:'number'},{n:'LTV %',t:'number'},{n:'Rate %',t:'number'},{n:'Term (years)',t:'number'}],calc:(i)=>{const loan=i['Collateral Value']*i['LTV %']/100;return{maxLoan:loan,payment:((loan*(i['Rate %']/100/12)*(1+i['Rate %']/100/12)**(i['Term (years)']*12)))/((1+i['Rate %']/100/12)**(i['Term (years)']*12)-1)}}},
            {cat:'Loans',name:'Unsecured Loan',fields:[{n:'Amount',t:'number'},{n:'Credit Score',t:'number'},{n:'Term (years)',t:'number'}],calc:(i)=>{const rate=i['Credit Score']>750?8:i['Credit Score']>700?12:16;return{estimatedRate:rate,monthlyPayment:((i.Amount*(rate/100/12)*(1+rate/100/12)**(i['Term (years)']*12)))/((1+rate/100/12)**(i['Term (years)']*12)-1)}}},
            {cat:'Mortgage',name:'Mortgage Payment',fields:[{n:'Home Price',t:'number'},{n:'Down Payment %',t:'number'},{n:'Rate %',t:'number'},{n:'Term (years)',t:'number'}],calc:(i)=>{const prin=i['Home Price']*(1-i['Down Payment %']/100);const m=i['Rate %']/100/12;const n=i['Term (years)']*12;return{principal:prin,payment:(prin*m*(1+m)**n)/((1+m)**n-1)}}},
            {cat:'Mortgage',name:'Affordability',fields:[{n:'Income',t:'number'},{n:'Debts',t:'number'}],calc:(i)=>({maxPrice:i.Income*0.28/0.005})},
            {cat:'Mortgage',name:'Refinance',fields:[{n:'Balance',t:'number'},{n:'Current Rate %',t:'number'},{n:'New Rate %',t:'number'},{n:'Years',t:'number'}],calc:(i)=>{const m1=i['Current Rate %']/100/12;const m2=i['New Rate %']/100/12;const n=i.Years*12;const oldPayment=(i.Balance*m1*(1+m1)**n)/((1+m1)**n-1);const newPayment=(i.Balance*m2*(1+m2)**n)/((1+m2)**n-1);return{savings:(oldPayment-newPayment)*n}}},
            {cat:'Mortgage',name:'Amortization',fields:[{n:'Loan Amount',t:'number'},{n:'Rate %',t:'number'},{n:'Years',t:'number'}],calc:(i)=>{const m=i['Rate %']/100/12;const n=i.Years*12;const payment=(i['Loan Amount']*m*(1+m)**n)/((1+m)**n-1);return{payment:payment,totalInterest:payment*n-i['Loan Amount']}}},
            {cat:'Mortgage',name:'Mortgage Comparison',fields:[{n:'Price',t:'number'},{n:'Rate 1 %',t:'number'},{n:'Rate 2 %',t:'number'},{n:'Years',t:'number'}],calc:(i)=>{const p=i.Price*0.8;const calc=(r)=>{const m=r/100/12;const n=i.Years*12;return(p*m*(1+m)**n)/((1+m)**n-1)};return{payment1:calc(i['Rate 1 %']),payment2:calc(i['Rate 2 %'])}}},
            {cat:'Mortgage',name:'ARM Calculator',fields:[{n:'Principal',t:'number'},{n:'Initial Rate %',t:'number'},{n:'Years Fixed',t:'number'}],calc:(i)=>{const m1=i['Initial Rate %']/100/12;const n1=i['Years Fixed']*12;return{initialPayment:(i.Principal*m1*(1+m1)**n1)/((1+m1)**n1-1)}}},
            {cat:'Mortgage',name:'FHA Loan',fields:[{n:'Price',t:'number'},{n:'Down Payment %',t:'number'},{n:'Rate %',t:'number'},{n:'Years',t:'number'}],calc:(i)=>{const prin=i.Price*(1-i['Down Payment %']/100);const m=i['Rate %']/100/12;const n=i.Years*12;return{principal:prin,payment:(prin*m*(1+m)**n)/((1+m)**n-1)}}},
            {cat:'Mortgage',name:'VA Loan',fields:[{n:'Price',t:'number'},{n:'Rate %',t:'number'},{n:'Years',t:'number'}],calc:(i)=>{const m=i['Rate %']/100/12;const n=i.Years*12;const fee=i.Price*0.03;const prin=i.Price+fee;return{fundingFee:fee,payment:(prin*m*(1+m)**n)/((1+m)**n-1)}}},
            {cat:'Mortgage',name:'USDA Loan',fields:[{n:'Price',t:'number'},{n:'Rate %',t:'number'},{n:'Years',t:'number'}],calc:(i)=>{const m=i['Rate %']/100/12;const n=i.Years*12;const fee=i.Price*0.02;return{guarantee:fee,payment:((i.Price+fee)*m*(1+m)**n)/((1+m)**n-1)}}},
            {cat:'Mortgage',name:'Jumbo Loan',fields:[{n:'Amount',t:'number'},{n:'Rate %',t:'number'},{n:'Years',t:'number'}],calc:(i)=>{const m=i['Rate %']/100/12;const n=i.Years*12;return{payment:(i.Amount*m*(1+m)**n)/((1+m)**n-1)}}},
            {cat:'Mortgage',name:'Biweekly Payment',fields:[{n:'Principal',t:'number'},{n:'Rate %',t:'number'},{n:'Years',t:'number'}],calc:(i)=>{const m=i['Rate %']/100/26;const n=i.Years*26;return{biweeklyPayment:(i.Principal*m*(1+m)**n)/((1+m)**n-1)}}},
            {cat:'Mortgage',name:'Rent vs Buy',fields:[{n:'Home Price',t:'number'},{n:'Rent/Month',t:'number'},{n:'Down Payment',t:'number'},{n:'Rate %',t:'number'},{n:'Years',t:'number'}],calc:(i)=>{const m=i['Rate %']/100/12;const n=i.Years*12;const prin=i['Home Price']-i['Down Payment'];const mortgage=(prin*m*(1+m)**n)/((1+m)**n-1);return{rentTotal:i['Rent/Month']*n,buyTotal:mortgage*n+i['Down Payment']}}},
            {cat:'Mortgage',name:'Property Tax',fields:[{n:'Home Value',t:'number'},{n:'Tax Rate %',t:'number'}],calc:(i)=>({annualTax:i['Home Value']*i['Tax Rate %']/100})},
            {cat:'Mortgage',name:'Home Equity',fields:[{n:'Home Value',t:'number'},{n:'Mortgage Balance',t:'number'}],calc:(i)=>({equity:i['Home Value']-i['Mortgage Balance']})},
            {cat:'Mortgage',name:'Closing Costs',fields:[{n:'Purchase Price',t:'number'}],calc:(i)=>({percent2:i['Purchase Price']*0.02})},
            {cat:'Mortgage',name:'Down Payment',fields:[{n:'Home Price',t:'number'},{n:'Down Payment %',t:'number'}],calc:(i)=>({downPayment:i['Home Price']*i['Down Payment %']/100})},
            {cat:'Mortgage',name:'PMI',fields:[{n:'Home Price',t:'number'},{n:'Down Payment %',t:'number'}],calc:(i)=>{const ltv=1-i['Down Payment %']/100;const pmiRate=ltv>0.95?0.015:0;return{pmiMonthly:i['Home Price']*pmiRate/12}}},
            {cat:'Mortgage',name:'Appreciation',fields:[{n:'Current Value',t:'number'},{n:'Rate %',t:'number'},{n:'Years',t:'number'}],calc:(i)=>({futureValue:i['Current Value']*(1+i['Rate %']/100)**i.Years})},
            {cat:'Mortgage',name:'Payoff Schedule',fields:[{n:'Balance',t:'number'},{n:'Rate %',t:'number'},{n:'Payment',t:'number'}],calc:(i)=>{const m=i['Rate %']/100/12;const n=-Math.log(1-i.Balance*m/i.Payment)/Math.log(1+m);return{months:Math.ceil(n)}}},
            {cat:'Savings',name:'Compound Interest',fields:[{n:'Principal',t:'number'},{n:'Rate %',t:'number'},{n:'Years',t:'number'},{n:'Compounds/Year',t:'number'}],calc:(i)=>({amount:i.Principal*(1+i['Rate %']/100/i['Compounds/Year'])**(i['Compounds/Year']*i.Years)})},
            {cat:'Savings',name:'Simple Interest',fields:[{n:'Principal',t:'number'},{n:'Rate %',t:'number'},{n:'Years',t:'number'}],calc:(i)=>({total:i.Principal+i.Principal*i['Rate %']/100*i.Years})},
            {cat:'Savings',name:'Savings Goal',fields:[{n:'Target',t:'number'},{n:'Annual Savings',t:'number'}],calc:(i)=>({years:i.Target/i['Annual Savings']})},
            {cat:'Savings',name:'Emergency Fund',fields:[{n:'Monthly Expenses',t:'number'},{n:'Months Coverage',t:'number'}],calc:(i)=>({target:i['Monthly Expenses']*i['Months Coverage']})},
            {cat:'Savings',name:'CD Calculator',fields:[{n:'Amount',t:'number'},{n:'Rate %',t:'number'},{n:'Years',t:'number'}],calc:(i)=>({maturity:i.Amount*(1+i['Rate %']/100)**i.Years})},
            {cat:'Savings',name:'APY Calculator',fields:[{n:'APR %',t:'number'},{n:'Compounds/Year',t:'number'}],calc:(i)=>({apy:(Math.pow(1+i['APR %']/100/i['Compounds/Year'],i['Compounds/Year'])-1)*100})},
            {cat:'Savings',name:'APR to APY',fields:[{n:'APR %',t:'number'},{n:'Compounds/Year',t:'number'}],calc:(i)=>({apy:(Math.pow(1+i['APR %']/100/i['Compounds/Year'],i['Compounds/Year'])-1)*100})},
            {cat:'Savings',name:'Effective Rate',fields:[{n:'Rate %',t:'number'},{n:'Compounds/Year',t:'number'}],calc:(i)=>({effective:(Math.pow(1+i['Rate %']/100/i['Compounds/Year'],i['Compounds/Year'])-1)*100})},
            {cat:'Savings',name:'Future Value',fields:[{n:'Present Value',t:'number'},{n:'Rate %',t:'number'},{n:'Years',t:'number'}],calc:(i)=>({future:i['Present Value']*(1+i['Rate %']/100)**i.Years})},
            {cat:'Savings',name:'Present Value',fields:[{n:'Future Value',t:'number'},{n:'Rate %',t:'number'},{n:'Years',t:'number'}],calc:(i)=>({present:i['Future Value']/(1+i['Rate %']/100)**i.Years})},
            {cat:'Savings',name:'Money Doubling',fields:[{n:'Rate %',t:'number'}],calc:(i)=>({years:72/i['Rate %']})},
            {cat:'Savings',name:'Rule of 72',fields:[{n:'Rate %',t:'number'}],calc:(i)=>({doubleYears:72/i['Rate %']})},
            {cat:'Savings',name:'Inflation Impact',fields:[{n:'Amount',t:'number'},{n:'Inflation %',t:'number'},{n:'Years',t:'number'}],calc:(i)=>({purchasingPower:i.Amount/(1+i['Inflation %']/100)**i.Years})},
            {cat:'Savings',name:'Purchasing Power',fields:[{n:'Amount',t:'number'},{n:'Inflation %',t:'number'},{n:'Years',t:'number'}],calc:(i)=>({power:i.Amount/(1+i['Inflation %']/100)**i.Years})},
            {cat:'Savings',name:'Recurring Deposit',fields:[{n:'Monthly Deposit',t:'number'},{n:'Rate %',t:'number'},{n:'Years',t:'number'}],calc:(i)=>{const m=i['Rate %']/100/12;const n=i.Years*12;return{total:i['Monthly Deposit']*((1+m)**n-1)/m}}},
            {cat:'Savings',name:'Savings Rate',fields:[{n:'Savings',t:'number'},{n:'Income',t:'number'}],calc:(i)=>({rate:i.Savings/i.Income*100})},
            {cat:'Savings',name:'HYSA',fields:[{n:'Deposit',t:'number'},{n:'APY %',t:'number'},{n:'Months',t:'number'}],calc:(i)=>({total:i.Deposit*(1+i['APY %']/100/12)**i.Months})},
            {cat:'Investing',name:'Investment Growth',fields:[{n:'Initial',t:'number'},{n:'Monthly',t:'number'},{n:'Rate %',t:'number'},{n:'Years',t:'number'}],calc:(i)=>{const m=i['Rate %']/100/12;const n=i.Years*12;return{future:i.Initial*(1+m)**n+i.Monthly*((1+m)**n-1)/m}}},
            {cat:'Investing',name:'Return Calculator',fields:[{n:'Initial',t:'number'},{n:'Final',t:'number'},{n:'Years',t:'number'}],calc:(i)=>({return:i.Final-i.Initial,annualized:((i.Final/i.Initial)**(1/i.Years)-1)*100})},

        const cats=['Loans','Mortgage','Savings','Investing','Debt/Credit','Income/Tax','Vehicles','Business','Education','Budgeting','Time/Misc','Premium'];

        function renderSidebar(){
            const sidebar=document.getElementById('sidebar');
            sidebar.innerHTML=cats.map(c=>`<a href="#" class="category-link" data-cat="${c}">${c}</a>`).join('');
            document.querySelectorAll('.category-link').forEach(link=>{
                link.addEventListener('click',(e)=>{
                    e.preventDefault();
                    document.querySelectorAll('.category-link').forEach(l=>l.classList.remove('active'));
                    link.classList.add('active');
                    const cat=link.dataset.cat;
                    const calcs=calculators.filter(c=>c.cat===cat);
                    renderCalcList(calcs);
                });
            });
        }

        function renderCalcList(calcs){
            const content=document.getElementById('mainContent');
            content.innerHTML=`<div class="calc-header"><h2 class="calc-title">${calcs[0].cat}</h2></div><div class="calc-buttons">${calcs.map(c=>`<button class="calc-btn" onclick="showCalc(${calculators.indexOf(c)})">${c.name}</button>`).join('')}</div><div id="calcContainer"></div>`;
        }

        window.showCalc=function(idx){
            const calc=calculators[idx];
            const html=`<div class="calc-form"><h3 style="margin-bottom:20px">${calc.name}</h3>${calc.fields.map((f,i)=>`<div class="form-group"><label class="form-label">${f.n}</label><input type="${f.t}" class="form-input" id="field${i}"></div>`).join('')}<div class="button-group"><button class="btn btn-primary" onclick="calculate(${idx})">Calculate</button><button class="btn btn-secondary" onclick="reset()">Reset</button></div></div><div class="results" id="results"></div>`;
            document.getElementById('calcContainer').innerHTML=html;
        };

        window.calculate=function(idx){
            const calc=calculators[idx];
            const input={};
            calc.fields.forEach((f,i)=>{const v=document.getElementById(`field${i}`).value;input[f.n]=f.t==='date'?v:parseFloat(v)});
            const result=calc.calc(input);
            const html=Object.entries(result).map(([k,v])=>`<div class="result-item"><div class="result-label">${k}</div><div class="result-value">${typeof v==='number'?'$'+v.toFixed(2):v}</div></div>`).join('');
            document.getElementById('results').innerHTML=html;
            document.getElementById('results').classList.add('show');
        };

        window.reset=function(){
            document.getElementById('results').classList.remove('show');
        };

        document.getElementById('searchInput').addEventListener('input',(e)=>{
            const q=e.target.value.toLowerCase();
            const results=calculators.filter(c=>c.name.toLowerCase().includes(q));
            if(results.length>0)renderCalcList(results);
        });

        renderSidebar();
        document.querySelector('.category-link').click();
    </script>
</body>
</html>
